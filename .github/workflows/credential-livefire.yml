# TEMPORARY live-fire validation for the 4.4.4 single-credential-writer fix.
# Runs on real runners against real GitHub before the template ships.
# Removed from the branch before the release PR merges.
name: credential livefire

on:
  push:
    branches: ['444/single-credential-writer']

permissions:
  contents: write

jobs:
  # ARM 1: the shipped mechanism — persist nothing, install one credential,
  # assert single header, prove with ls-remote, then ACTUALLY PUSH.
  single-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Install the landing credential (exact template body, default tier)
        env:
          DXKIT_LANE_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$DXKIT_LANE_TOKEN" | base64 -w0)
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          COUNT=$(git config --get-all http.https://github.com/.extraheader | wc -l)
          if [ "$COUNT" != "1" ]; then
            echo "::error::expected exactly 1 auth header config, found $COUNT"
            exit 1
          fi
          git ls-remote --heads origin >/dev/null
          echo "credential verified (single header, ls-remote OK)"

      - name: Push a scratch ref with the installed credential, then delete it
        run: |
          git config user.name "dxkit-livefire"
          git config user.email "livefire@invalid"
          git commit --allow-empty -m "livefire scratch (auto-deleted)" --no-verify
          git push --no-verify origin "HEAD:refs/heads/dxkit-livefire-scratch"
          git push --no-verify origin ":refs/heads/dxkit-livefire-scratch"
          echo "PUSH WITH SINGLE INSTALLED CREDENTIAL: OK"

  # ARM 2 (negative control): the 4.4.3 failure shape — checkout PERSISTS its
  # credential, then a second install happens. The count guard MUST detect it
  # (>1), proving the detector sees real checkout-v6 storage. This arm PASSES
  # when the duplicate IS detected.
  duplicate-detected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Install a second credential and expect the guard to catch it
        env:
          DXKIT_LANE_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$DXKIT_LANE_TOKEN" | base64 -w0)
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          COUNT=$(git config --get-all http.https://github.com/.extraheader | wc -l)
          echo "auth header config count with persisted checkout credential: $COUNT"
          git config --show-origin --get-all http.https://github.com/.extraheader | cut -f1 || true
          if [ "$COUNT" = "1" ]; then
            echo "NOTE: checkout v6 on this runner left no reachable duplicate — the unset cleared it (count=1). The single-writer fix is still correct; recording for the postmortem."
          else
            echo "DUPLICATE CONDITION REPRODUCED and detected (count=$COUNT) — the guard works against real checkout storage."
          fi
