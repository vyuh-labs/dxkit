# TEMPORARY live-fire validation for the FINAL 4.4.4 sequence (two-step
# credential install). Removed before the release PR merges.
name: credential livefire
on:
  push:
    branches: ['444/single-credential-writer']
permissions:
  contents: write
jobs:
  final-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false
      - name: Install the working credential
        env:
          DXKIT_LANE_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$DXKIT_LANE_TOKEN" | base64 -w0)
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          COUNT=$(git config --get-all http.https://github.com/.extraheader | wc -l)
          [ "$COUNT" = "1" ] || { echo "::error::working credential count=$COUNT"; exit 1; }
          git ls-remote --heads origin >/dev/null
          echo "working credential OK"
      - name: Simulated setup phase uses authenticated git
        run: git fetch origin --quiet && echo "authenticated fetch during setup OK"
      - name: Install the landing credential (replaces the working one)
        env:
          DXKIT_LANE_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$DXKIT_LANE_TOKEN" | base64 -w0)
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          COUNT=$(git config --get-all http.https://github.com/.extraheader | wc -l)
          [ "$COUNT" = "1" ] || { echo "::error::landing credential count=$COUNT"; exit 1; }
          git ls-remote --heads origin >/dev/null
          echo "landing credential OK"
      - name: Push with the landing credential, then delete the scratch ref
        run: |
          git config user.name "dxkit-livefire"
          git config user.email "livefire@invalid"
          git commit --allow-empty -m "livefire scratch (auto-deleted)" --no-verify
          git push --no-verify origin "HEAD:refs/heads/dxkit-livefire-scratch"
          git push --no-verify origin ":refs/heads/dxkit-livefire-scratch"
          echo "FINAL SEQUENCE PUSH: OK"
