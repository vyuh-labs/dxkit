name: dxkit remediate

# The agentic remediation lane, scheduled: an agent fixes what the
# deterministic lanes cannot (majors needing code changes, the grandfathered
# build/test/lint debt, missing tests), INSIDE the verified frame — entry
# floor snapshot, agent run under a hard budget, floor re-run attributed
# against entry (only net-new failures block), guardrail as final arbiter —
# then ONE standing, reviewable PR per task (dxkit/remediate-<task>) whose
# body is the verification ledger + the agent envelope (model, turns, spend,
# outcome). The agent's own claim of "done" is never trusted; a red net-new
# floor means NO PR and a failing job with the ledger in the step summary.
#
# SECURITY: schedule + workflow_dispatch ONLY — never issue_comment, never
# pull_request. The agent runs exclusively against the default branch (the
# maintainers' own tree) with dxkit-authored task prompts; free-text prompts
# do not exist in this lane. The API key comes from repo secrets, reaches the
# driver as env only, and is never logged or echoed into the ledger. Use a
# scoped workspace key with a spend limit, not a personal key. Expected
# egress: the Anthropic API, the package registry, and git origin.
#
# Enabled by `.dxkit/policy.json:remediate.enabled: true` + `vyuh-dxkit update`.
# Budget, tasks, model tier, and salvage policy are read from the committed
# policy by the CLI itself — this workflow carries no tuning of its own.
#
# STRUCTURE: one MATRIX JOB PER TASK, each on its own checkout. The serial
# shape this replaces coupled the tasks through one tree — a single failed
# task's unlanded work starved every task after it, and the whole lane was
# one monolithic log. The matrix kills the coupling structurally: per-task
# status on the run page, per-task logs/summaries, per-task retry, parallel
# wall-clock. The task list comes from `remediate plan --json` (the one
# config reader, spend-ceiling applied) — never a shell parse of policy.

on:
  schedule:
    - cron: '__DXKIT_REMEDIATE_CRON__'
  # Dispatch campaigns (one-time runs with per-run overrides). The scheduled
  # posture reads policy; a dispatch is an explicit, WRITE-GATED human action
  # (GitHub only lets users with write access fire it), so it may select one
  # task — including `custom` with a free-text prompt — and override budgets
  # within the committed `remediate.maxDispatchBudget` ceiling. The prompt
  # travels via ENV (never shell-interpolated) and is disclosed verbatim in
  # the PR body; the work still lands only through the verified frame.
  workflow_dispatch:
    inputs:
      task:
        description: 'Run ONE task (blank = the scheduled set)'
        type: choice
        default: ''
        options:
          - ''
__DXKIT_REMEDIATE_TASK_OPTIONS__
          - custom
      prompt:
        description: 'Custom task prompt (task=custom only; disclosed verbatim in the PR)'
        type: string
        default: ''
      max_usd:
        description: 'Spend override in USD (blank = policy; clamped to remediate.maxDispatchBudget)'
        type: string
        default: ''
      max_turns:
        description: 'Turn-cap override (blank = policy; clamped against remediate.maxDispatchBudget — turns govern real spend)'
        type: string
        default: ''
      max_minutes:
        description: 'Wall-clock override in minutes (blank = policy)'
        type: string
        default: ''
      model:
        description: 'Model override (blank = policy)'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: dxkit-remediate-plan
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: __DXKIT_DEFAULT_BRANCH__

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies + dxkit
        run: |
          __DXKIT_INSTALL_DEPS__

      - name: Compute the task matrix
        id: plan
        env:
          # A dispatch that names a task runs EXACTLY that task (its choice
          # list is rendered from the registry, so the value is a known id or
          # `custom`); blank falls through to the scheduled, spend-ceilinged
          # set from the plan.
          DISPATCH_TASK: ${{ github.event.inputs.task || '' }}
        run: |
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then DXKIT=./node_modules/.bin/vyuh-dxkit; else DXKIT=vyuh-dxkit; fi
          "$DXKIT" remediate plan --json > remediate-plan.json
          node - <<'EOF'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('remediate-plan.json', 'utf8'));
          const dispatchTask = (process.env.DISPATCH_TASK || '').trim();
          const tasks = dispatchTask ? [dispatchTask] : (p.matrixTasks ?? []);
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `tasks=${JSON.stringify(tasks)}\n`);
          fs.appendFileSync(out, `any=${tasks.length > 0 ? 'true' : 'false'}\n`);
          const deferred = dispatchTask ? [] : (p.deferredBySpendCeiling ?? []);
          if (deferred.length > 0) {
            console.log(`::notice title=remediate spend ceiling::deferred to the next firing: ${deferred.join(', ')}`);
          }
          // Scheduler-memory disclosures (never silent): classes the circuit
          // breaker paused, tasks with no open orders (no job, $0), and the
          // matrix derivation notes from the plan.
          for (const pause of p.pausedClasses ?? []) {
            console.log(`::notice title=remediate circuit breaker::class '${pause.class}' is PAUSED: ${pause.reason}. Unpause: ${pause.unpause}`);
          }
          for (const note of p.matrixDisclosures ?? []) {
            console.log(`::notice title=remediate matrix::${note}`);
          }
          console.log('matrix:', JSON.stringify(tasks));
          EOF

  remediate:
    name: dxkit-remediate (${{ matrix.task }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One task's failure must never cancel (or starve) its siblings — the
      # exact coupling the matrix exists to kill.
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
__DXKIT_LANE_TOKEN_STEPS__

      - uses: actions/checkout@v6
        with:
          ref: __DXKIT_DEFAULT_BRANCH__
          fetch-depth: 0
          # Branches pushed with the default GITHUB_TOKEN never trigger
          # workflow runs, so the lane's PRs would show no checks. The ONE
          # tier chain (src/lanes/lane-token.ts) retires that degradation.
          token: __DXKIT_LANE_TOKEN__
          # ONE credential writer (the live 4.4.3 class): checkout v6
          # persists its credential in storage `git config --unset-all`
          # cannot reliably clear, so any later credential install risks
          # git sending TWO Authorization headers — GitHub 400s the push.
          # The checkout authenticates its own fetch with the token above
          # and persists NOTHING; the credential-install steps below are
          # the only writers (each unsets everything before setting one
          # value), and each proves itself with an ls-remote.
          persist-credentials: false

      # Working credential for the SETUP phase: dependency install may need
      # authenticated git (a private git-pinned dependency), and the
      # checkout persisted nothing. Same body as the landing install below;
      # the landing step REPLACES this value with the fresh task-time token.
      - name: Install the working credential
        env:
          DXKIT_LANE_TOKEN: __DXKIT_LANE_TOKEN__
        run: |
          AUTH=$(printf 'x-access-token:%s' "$DXKIT_LANE_TOKEN" | base64 -w0)
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          COUNT=$(git config --get-all http.https://github.com/.extraheader | wc -l)
          if [ "$COUNT" != "1" ]; then
            echo "::error title=working credential::expected exactly 1 auth header config, found $COUNT"
            exit 1
          fi
          git ls-remote --heads origin >/dev/null
          echo "working credential verified (single auth header, ls-remote OK)"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Language runtime(s) for the detected stack, so the correctness floor
      # can build + run the tests that verify the agent's work.
__DXKIT_CI_RUNTIME_SETUP__
      # Install with the repo's own package manager (the verified tree must
      # be the tree the repo ships).
      - name: Install dependencies + dxkit
        run: |
          __DXKIT_INSTALL_DEPS__

      - name: Install scanner tools
        run: |
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then
            ./node_modules/.bin/vyuh-dxkit tools install --yes
          else
            vyuh-dxkit tools install --yes
          fi
          for d in "$HOME/.local/bin" "$HOME/go/bin" "$HOME/.cargo/bin"; do
            echo "$d" >> "$GITHUB_PATH"
          done

      # PINNED to the version the driver registry declares (an unattended
      # lane must not float its executor; the envelope records the build).
      - name: Install the agent CLI (pinned)
        run: __DXKIT_REMEDIATE_AGENT_CLI_INSTALL__

      # A runner has no ambient git identity, and the AGENT's own commits
      # need one (the runner's sweep + ledger commits carry the bot identity
      # explicitly). Rendered from the one BOT_IDENTITY constant.
      - name: Configure the lane's git identity
        run: |
          git config user.name "__DXKIT_BOT_NAME__"
          git config user.email "__DXKIT_BOT_EMAIL__"

      # An App installation token is hard-capped at ONE HOUR by GitHub, and
      # the first mint happened before checkout + toolchain install — so a
      # long agent budget could outlive it and 401 the LANDING push after
      # the full agent spend. Re-mint here so the token's lifetime starts
      # at agent launch, not at job start; the CLI additionally clamps the
      # agent budget on this tier so agent + verify + landing fit inside
      # the fresh token (disclosed in the ledger, never silent).
__DXKIT_LANE_TOKEN_TASK_STEPS__

      # The ONE landing credential, every tier. The checkout persisted
      # nothing (persist-credentials: false above), so this step is the
      # only credential writer: it installs the tier-chain token (the
      # fresh task-time App mint when configured, else the PAT, else the
      # default token), asserts exactly one Authorization source exists —
      # a duplicate makes GitHub 400 the landing push with "Duplicate
      # header", the class that killed a full agent run — and PROVES the
      # credential with an ls-remote. A broken landing credential fails
      # HERE, at $0, before any agent spawns; never at delivery.
      - name: Install the landing credential
        env:
          DXKIT_LANE_TOKEN: __DXKIT_LANE_TOKEN_TASK__
        run: |
          AUTH=$(printf 'x-access-token:%s' "$DXKIT_LANE_TOKEN" | base64 -w0)
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          COUNT=$(git config --get-all http.https://github.com/.extraheader | wc -l)
          if [ "$COUNT" != "1" ]; then
            echo "::error title=landing credential::expected exactly 1 auth header config, found $COUNT (a duplicate would 400 the landing push)"
            exit 1
          fi
          git ls-remote --heads origin >/dev/null
          echo "landing credential verified (single auth header, ls-remote OK)"

      # ONE task per job (this matrix row's own checkout): the CLI verifies
      # inside the frame, opens the task's standing PR, writes the ledger to
      # THIS job's step summary, streams per-phase log groups + heartbeats,
      # and exits non-zero when the task did not end clean — a truthful
      # per-task failure, visible on the run page without opening logs.
      - name: Run task ${{ matrix.task }}
        env:
          GH_TOKEN: __DXKIT_LANE_TOKEN_TASK__
          # The tier the run resolved (mirrors the Disclose step): 'app'
          # tells the CLI the credential is a one-hour installation token,
          # so it clamps the agent budget to fit landing inside it.
          DXKIT_TOKEN_MODE: __DXKIT_LANE_TOKEN_MODE__
          # Dispatch-campaign inputs, transported via ENV only (the
          # comment-defer pattern — free text never touches a shell line).
          # Blank on scheduled runs; the CLI clamps budget overrides to the
          # committed remediate.maxDispatchBudget and discloses every clamp.
          # The dispatch input, always DEFINED here (blank on scheduled
          # runs): the run step derives the explicit --dispatch-override
          # flag from it, and the CLI uses the variable's absence to detect
          # a pre-flag workflow template (advises `vyuh-dxkit update`).
          DXKIT_DISPATCH_TASK: ${{ github.event.inputs.task || '' }}
          DXKIT_CUSTOM_PROMPT: ${{ github.event.inputs.prompt || '' }}
          DXKIT_DISPATCH_MAX_USD: ${{ github.event.inputs.max_usd || '' }}
          DXKIT_DISPATCH_MAX_TURNS: ${{ github.event.inputs.max_turns || '' }}
          DXKIT_DISPATCH_MAX_MINUTES: ${{ github.event.inputs.max_minutes || '' }}
          DXKIT_DISPATCH_MODEL: ${{ github.event.inputs.model || '' }}
__DXKIT_REMEDIATE_CREDENTIAL_ENV__
        run: |
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then DXKIT=./node_modules/.bin/vyuh-dxkit; else DXKIT=vyuh-dxkit; fi
          # The dispatch override is an EXPLICIT flag, passed only when a
          # human's workflow_dispatch named exactly this task: it lifts a
          # circuit-breaker pause on the task's classes for this one run.
          # Scheduled matrix runs never carry it.
          OVERRIDE=""
          if [ -n "$DXKIT_DISPATCH_TASK" ] && [ "$DXKIT_DISPATCH_TASK" = "${{ matrix.task }}" ]; then
            OVERRIDE="--dispatch-override"
          fi
          set +e
          "$DXKIT" remediate --task "${{ matrix.task }}" --land pr $OVERRIDE
          EXIT=$?
          set -e
          # Kill-shaped death disclosure (dxkit #289): SIGKILL is uncatchable,
          # so a killed frame cannot write its own obituary — the only layer
          # that survives is this one. A 137/143 exit with only the
          # PROVISIONAL record (written before the agent spawned) means the
          # frame died mid-agent-phase. The cause is a HYPOTHESIS (a runner
          # OOM is one common producer of SIGKILL) — the disclosure names the
          # signal and the phase, never invents a cause.
          if [ "$EXIT" -eq 137 ] || [ "$EXIT" -eq 143 ]; then
            REC=".dxkit/cache/remediate-${{ matrix.task }}.json"
            PHASE=$(node -e "try{console.log(require('./' + process.argv[1]).phase||'')}catch{}" "$REC" 2>/dev/null || true)
            if [ "$PHASE" = "agent" ]; then
              echo "::warning title=dxkit remediate ${{ matrix.task }}::the frame was KILLED mid-agent-phase (exit $EXIT — kill-shaped; a runner out-of-memory kill is one possible cause). Partial work, if any, is in the attempt artifact."
              {
                echo "## dxkit remediate: ${{ matrix.task }} — frame killed mid-agent-phase"
                echo ""
                echo "Exit $EXIT (kill-shaped) with only the provisional attempt record present:"
                echo "the process was killed before it could classify its own death. A runner"
                echo "out-of-memory kill is one possible cause (hypothesis, not a measurement)."
                echo "Partial committed work, if any, is preserved in the attempt artifact."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$EXIT"

      # A BLOCKED / failed attempt's diff must survive the ephemeral runner:
      # the runner writes a machine-readable attempt record; when nothing
      # landed but commits exist, format-patch them into a run artifact so
      # "stays local for inspection" means something a human can download.
      # A PROVISIONAL record (the frame died mid-agent-phase, #289) has no
      # `head` — fall back to the checkout's live HEAD, which carries
      # whatever the agent committed before death.
      - name: Collect the attempt diff (evidence when nothing landed)
        if: always()
        run: |
          REC=".dxkit/cache/remediate-${{ matrix.task }}.json"
          if [ -f "$REC" ]; then
            RANGE=$(node -e "const r=require('./' + process.argv[1]); if (!r.landed && r.baseHead) { const head = r.head || (r.phase === 'agent' ? 'HEAD' : null); if (head && r.baseHead !== head) console.log(r.baseHead + '..' + head); }" "$REC")
            if [ -n "$RANGE" ]; then
              git format-patch --stdout "$RANGE" > remediate-attempt.patch
              echo "wrote remediate-attempt.patch for $RANGE"
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediate-${{ matrix.task }}-attempt
          path: remediate-attempt.patch
          if-no-files-found: ignore
          retention-days: 14
