name: dxkit dep bump

# The deterministic dependency-bump lane, scheduled: computes the fixable
# subset of the repo's dependency vulnerabilities from the scanners' own fix
# versions (no LLM anywhere), applies the bumps with the repo's OWN package
# manager, verifies with the correctness floor (full compile + test run) and
# the guardrail, and lands manifest + lockfile as ONE standing, reviewable PR
# (`dxkit/dep-bump`) whose body is the verification ledger. A red floor means
# NO PR — the job fails with the ledger in the step summary instead.
#
# Majors are skipped-and-named by default (a scheduled robot PR must be
# boring to merge); opt in per-repo via `.dxkit/policy.json:depBump.allowMajor`.
# Enabled by `.dxkit/policy.json:depBump.enabled: true` + `vyuh-dxkit update`.

on:
  schedule:
    # Rendered from `.dxkit/policy.json:depBump.schedule` (weekly | daily | a
    # 5-field cron). Absent = Monday 07:00 UTC. Change the policy knob and run
    # `vyuh-dxkit update` — do not edit this line (update re-renders it).
    - cron: '__DXKIT_DEPBUMP_CRON__'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  dep-bump:
    name: dxkit-dep-bump
    runs-on: ubuntu-latest
    steps:
      # Lane token, three tiers (4.4.1 WP7). Preferred: a GitHub App —
      # no billed seat, a short-lived token minted per run (the PAT-expiry
      # class cannot recur), and lane activity attributed to the app's own
      # bot identity, whose PRs a maintainer can approve. Configure: the
      # repository (or org) VARIABLE DXKIT_APP_ID + the secret
      # DXKIT_APP_PRIVATE_KEY, with the app installed on this repo holding
      # contents + pull-requests write. Falls back to the DXKIT_BOT_TOKEN
      # PAT, then the default token (whose PRs run no checks). A
      # configured-but-broken App FAILS THIS STEP loudly rather than
      # silently degrading a tier — a config error must not quietly change
      # which identity pushes.
      - name: Mint the lane token (GitHub App, when configured)
        id: dxkit-app-token
        if: ${{ vars.DXKIT_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DXKIT_APP_ID }}
          private-key: ${{ secrets.DXKIT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: __DXKIT_DEFAULT_BRANCH__
          fetch-depth: 0
          # Optional bot PAT: a branch pushed with the default GITHUB_TOKEN
          # never triggers workflow runs, so a lane-opened PR arrives with NO
          # checks (uncheckable under branch protection). Set the
          # DXKIT_BOT_TOKEN secret (a PAT with repo scope) to retire that
          # degradation; absent, the lane still works and discloses it.
          token: ${{ steps.dxkit-app-token.outputs.token || secrets.DXKIT_BOT_TOKEN || github.token }}

      - name: Disclose token mode
        env:
          DXKIT_APP_SET: ${{ vars.DXKIT_APP_ID != '' }}
          DXKIT_BOT_TOKEN_SET: ${{ secrets.DXKIT_BOT_TOKEN != '' }}
        run: |
          if [ "${DXKIT_APP_SET}" = "true" ]; then
            echo "token tier: GitHub App (short-lived, minted this run)"
          elif [ "${DXKIT_BOT_TOKEN_SET}" = "true" ]; then
            echo "token tier: DXKIT_BOT_TOKEN (PAT)"
          else
            echo "::notice title=lane PRs run no checks::This lane pushes with the default GITHUB_TOKEN, and GitHub never triggers workflows for such pushes - the PR it opens will show no checks. Preferred fix: a GitHub App (set the DXKIT_APP_ID variable + the DXKIT_APP_PRIVATE_KEY secret - no billed seat, short-lived per-run tokens). A DXKIT_BOT_TOKEN PAT secret with repo scope also works."
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Language runtime(s) for the detected stack, so the correctness floor
      # can build + run the tests that verify the bumps.
__DXKIT_CI_RUNTIME_SETUP__
      # Install with the repo's own package manager (see the guardrails
      # workflow for the rationale — the verified tree must be the tree the
      # repo ships).
      - name: Install dependencies + dxkit
        run: |
          corepack enable >/dev/null 2>&1 || true
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --immutable 2>/dev/null || yarn install --frozen-lockfile
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            npm install -g bun >/dev/null 2>&1 || true
            bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci || npm ci --legacy-peer-deps
          elif [ -f package.json ]; then
            npm install || npm install --legacy-peer-deps
          else
            npm install -g @vyuhlabs/dxkit
          fi

      - name: Install scanner tools
        run: |
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then
            ./node_modules/.bin/vyuh-dxkit tools install --yes
          else
            vyuh-dxkit tools install --yes
          fi
          for d in "$HOME/.local/bin" "$HOME/go/bin" "$HOME/.cargo/bin"; do
            echo "$d" >> "$GITHUB_PATH"
          done

      # Plan → apply → verify (floor + guardrail) → land the standing PR.
      # Branch + PR mechanics live in the CLI (the shared refresh lander),
      # never in this workflow. --allow-major is appended only when the
      # committed policy opts in.
      - name: Run the bump lane
        env:
          GH_TOKEN: ${{ steps.dxkit-app-token.outputs.token || secrets.DXKIT_BOT_TOKEN || github.token }}
        run: |
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then DXKIT=./node_modules/.bin/vyuh-dxkit; else DXKIT=vyuh-dxkit; fi
          EXTRA=""
          # One policy reader everywhere (JSONC-aware) — never a hand-rolled parse.
          AM=$("$DXKIT" policy get depBump.allowMajor --default false)
          if [ "$AM" = "true" ]; then EXTRA="--allow-major"; fi
          "$DXKIT" deps bump --apply --land pr $EXTRA --json > dep-bump.json
          # Surface the REAL outcome + note; a refused/floor-red lane already
          # exited 1. The outcome now derives from the land result, so a
          # branch-pushed-no-pr (PR creation refused by repo settings) can
          # never print as "landed" — it prints its remedy and annotates the
          # run so the degradation is visible from the Actions list.
          node - <<'EOF'
          const r = require('./dep-bump.json');
          const url = (r.land && r.land.prUrl) || '';
          console.log('outcome:', r.outcome, url);
          if (r.note) console.log('note:', r.note);
          if (r.outcome === 'branch-pushed-no-pr') {
            const msg = (r.note || 'branch pushed, PR creation failed - open it manually').replace(/\n/g, ' ');
            console.log('::warning title=dep-bump PR not opened::' + msg);
          }
          EOF
