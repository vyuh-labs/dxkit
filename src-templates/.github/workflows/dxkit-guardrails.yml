name: dxkit guardrails

# Runs ./dxkit-guardrails.sh (the findings guardrail, policy-render parity
# and the correctness floor) on every pull request. New regressions vs.
# the committed `.dxkit/baselines/main.json` block the PR. Existing
# findings (your "brownfield debt") are allowed — they were already
# captured when you ran `vyuh-dxkit baseline create`. Run
# `./dxkit-guardrails.sh` locally to get this workflow's verdict first.
#
# Customise by editing your project's `.dxkit/policy.json` (created by
# `vyuh-dxkit init --with-ci`). The matcher's classifications
# (added / relocated / tooling_drift / config_drift / persisted /
# removed / fixed) map to block/warn buckets there.

on:
  pull_request:__DXKIT_CI_PUSH_TRIGGER__

permissions:
  contents: read
  pull-requests: write

# One live run per ref: a push during a run cancels the superseded run, so a
# stale report can never finish LAST and overwrite the current commit's PR
# comment (observed live: a pre-fix run outlived the post-fix run by seconds
# and posted its BLOCKED report over the newer PASSED one).
concurrency:
  group: dxkit-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrail:
    # The job `name:` IS the status-check context GitHub reports and that a
    # ruleset / branch protection must require. It must equal dxkit's
    # GUARDRAIL_CHECK ('dxkit-guardrails') — the name `protect` writes and
    # `classifyEnforcement` matches. Without an explicit name GitHub used the job
    # id ('guardrail'), which nothing dxkit configured ever matched. The
    # invariant is pinned by test/enforcement-check-name.test.ts.
    name: dxkit-guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the git-aware matcher can resolve the
          # baseline's anchor commit + diff against HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '{{NODE_VERSION}}'

      # Language runtime(s) for the DETECTED stack (setup-go / setup-python / …),
      # so the pack's native dep scanner can install and the correctness floor can
      # build + run tests. Rendered from active packs at install; empty on a
      # Node-only repo. Node above is dxkit's own CLI runtime.
__DXKIT_CI_RUNTIME_SETUP__
      # Install the project's deps with ITS package manager so the guardrail
      # audits the dependency tree the repo actually SHIPS — not a fabricated npm
      # resolution (a bare `npm install` on a pnpm repo invents a different tree,
      # so the audit both flags phantom vulns and can miss real ones). corepack
      # ships with Node and provides pnpm/yarn with no extra setup action, honoring
      # the repo's `packageManager` field; bun is fetched only when its lockfile is
      # present. A project-local dxkit devDependency is installed along the way.
      - name: Install dependencies + dxkit
        run: |
          # A repo whose tree only resolves under --legacy-peer-deps (a peer
          # conflict its own install already tolerates) must not fail the gate.
          # `npm ci` installs the LOCKFILE's tree either way — the flag only
          # skips the peer check that rejects it — so the audited tree is still
          # the tree the repo ships. Re-resolving (`npm install`) is NOT a valid
          # fallback here: it would fabricate a different tree.
          __DXKIT_INSTALL_DEPS__

      # Install the scanner toolchain dxkit needs for this stack
      # (gitleaks, semgrep, cloc, jscpd, ruff, osv-scanner, etc.).
      # `--yes` makes the install non-interactive; the registry
      # decides what to install based on detected languages.
      - name: Install scanner tools
        run: |
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then
            ./node_modules/.bin/vyuh-dxkit tools install --yes
          else
            vyuh-dxkit tools install --yes
          fi
          # Put every ecosystem's tool-bin dir on PATH so the correct NATIVE dep
          # scanner is found for whatever language this repo is — osv-scanner /
          # pip-audit in ~/.local/bin, govulncheck in ~/go/bin, cargo-audit in
          # ~/.cargo/bin. Without this the audit can't find its scanner and
          # silently falls back to a wrong-artifact one (e.g. npm-audit on a pnpm
          # repo), drifting from the baseline. Language-agnostic on purpose.
          for d in "$HOME/.local/bin" "$HOME/go/bin" "$HOME/.cargo/bin"; do
            echo "$d" >> "$GITHUB_PATH"
          done

      # Baseline anchor transport (committed modes only; see .dxkit/policy.json
      # baseline.anchor). 'tree' = anchor committed in the repo; 'branch' = dxkit
      # hydrates it from the side branch itself during the check; 'cache' = restore
      # it here from the Actions cache the refresh job wrote for this base commit.
      # (A cache miss falls back to a ref-based gather inside dxkit-guardrails.sh.)
      - name: Detect baseline anchor transport
        id: anchor
        run: |
          # One policy reader everywhere (JSONC-aware) — never a hand-rolled parse.
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then DXKIT=./node_modules/.bin/vyuh-dxkit; else DXKIT=vyuh-dxkit; fi
          T=$("$DXKIT" policy get baseline.anchor --default tree)
          echo "transport=$T" >> "$GITHUB_OUTPUT"

      - name: Restore cached baseline anchor
        if: steps.anchor.outputs.transport == 'cache'
        uses: actions/cache/restore@v4
        with:
          path: .dxkit/baselines
          key: dxkit-baseline-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            dxkit-baseline-

      # Restore the code graph the graph-refresh workflow cached for this base
      # SHA, so graph consumers (flow console, finding context) reuse it instead
      # of a cold rebuild. Best-effort: a cache miss just means a consumer
      # rebuilds on demand. No-op unless graph.refresh is enabled (the workflow
      # that populates this cache is opt-in).
      - name: Restore cached code graph
        uses: actions/cache/restore@v4
        with:
          path: .dxkit/reports/graph.json
          key: dxkit-graph-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            dxkit-graph-

      # Tree-trust decision, made ONCE and read by every step that analyzes
      # the checked-out source (guardrail check, flow console).
      #
      # S-05 (4.0.4) keyed this on the pull_request event: every PR ran with
      # the plugin-trust boundary active, which also disabled repo-declared
      # custom-check/lint commands — so net-new lint errors silently stopped
      # gating at PR time (4.3.2). The boundary is now keyed on FORK-ness,
      # the same line GitHub's own secrets model draws:
      #   - a FORK head is third-party input → --untrusted. Executable
      #     flow/extension plugins and repo-declared check commands are
      #     disabled (disclosed, not silent); plugin-derived routes still
      #     reach the gate through the committed served.json snapshot,
      #     produced by trusted default-branch runs.
      #   - a SAME-REPO head was pushed by someone with write access, whose
      #     code already executes in this repo's other PR workflows (test
      #     jobs run the repo's own scripts). Running its committed check
      #     commands here adds no new surface, and keeps lint/custom-check
      #     gating LIVE at PR time.
      # A missing head repo (deleted fork) compares unequal → untrusted.
      # Fail closed.
      - name: Resolve tree trust
        id: trust
        env:
          DXKIT_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          UNTRUSTED=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${DXKIT_PR_HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "fork PR head (${DXKIT_PR_HEAD_REPO:-unknown}) — analyzing as untrusted content"
            UNTRUSTED="--untrusted"
          fi
          echo "flag=$UNTRUSTED" >> "$GITHUB_OUTPUT"

      # The checks (findings guardrail, policy-render parity, correctness
      # floor) and their ORDER live in one place: ./dxkit-guardrails.sh at
      # the repo root. The pre-push hook runs the same script (--quick), and a
      # developer or agent runs it with no arguments to get this job's verdict
      # locally. This step hands it only the pipeline's plumbing:
      #   --base       the PR's base branch (empty on a push-trigger run). The
      #                floor attributes a failure against the merge-base (only a
      #                net-new failure blocks; a pre-existing broken base warns by
      #                name), and a PR into a NON-default base is gated against
      #                that base (ref-based), since the committed baseline is
      #                anchored to the default branch.
      #   --untrusted  the fork decision from 'Resolve tree trust'.
      #   --report     the markdown the 'Post PR comment' step posts: the
      #                guardrail verdict, then any policy drift, then any floor
      #                failure (a failing floor is never quiet).
      # The script runs every check even after one fails, writes the report,
      # annotates this log and the step summary, and exits non-zero when any
      # check failed, which fails this job. A cache-transport repo whose cache
      # missed falls back to a ref-based gather inside the script, too.
      - name: Run dxkit guardrails (guardrail, policy parity, floor)
        id: guardrail
        env:
          # The PR's base branch (empty on a push-trigger run).
          DXKIT_PR_BASE: ${{ github.base_ref }}
        run: |
          # Refuse a file without dxkit's header: it is not the entry point.
          if [ ! -f ./dxkit-guardrails.sh ] || ! grep -q 'dxkit guardrails entry point' ./dxkit-guardrails.sh; then
            echo "::error::dxkit-guardrails.sh is missing from the repo root, or is not dxkit's, so this PR was NOT gated. Run 'npx vyuh-dxkit update' and commit the script."
            exit 1
          fi
          # Trust boundary decided once in the 'Resolve tree trust' step above.
          UNTRUSTED="${{ steps.trust.outputs.flag }}"
          sh ./dxkit-guardrails.sh --report guardrail-report.md ${DXKIT_PR_BASE:+--base "$DXKIT_PR_BASE"} $UNTRUSTED

      # Interactive flow console (design §E) — a self-contained HTML artifact
      # scoped to THIS PR: the UI→API map + a browser-side request runner for the
      # integrations the diff touches, with any net-new break flagged. dxkit
      # generates it statically and makes no HTTP call; the runner calls from the
      # reviewer's browser with a Base URL + token they enter, never committed.
      # Self-skips (produces nothing to upload) on a repo with no UI→API surface.
      - name: Generate flow console
        id: console
        # always() so the console still generates when the gate BLOCKED — but
        # never without a resolved trust decision: if the trust step did not
        # run (an earlier step failed), its empty output would read as
        # trusted, which on a fork PR is fail-open. Skip instead.
        if: always() && steps.trust.outcome == 'success'
        run: |
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then
            DXKIT=./node_modules/.bin/vyuh-dxkit
          else
            DXKIT=vyuh-dxkit
          fi
          set +e
          # Trust boundary decided once in the 'Resolve tree trust' step above.
          UNTRUSTED="${{ steps.trust.outputs.flag }}"
          "${DXKIT}" flow console $UNTRUSTED --diff "${{ github.event.pull_request.base.sha }}" \
            --out flow-console.html --json > console.json 2>/dev/null
          set -e
          eps=$(node -e "try{const j=require('./console.json');process.stdout.write(String((j.shownEndpoints||0)+(j.broken||0)))}catch(e){process.stdout.write('0')}" 2>/dev/null || echo 0)
          brk=$(node -e "try{const j=require('./console.json');process.stdout.write(String(j.broken||0))}catch(e){process.stdout.write('0')}" 2>/dev/null || echo 0)
          echo "endpoints=$eps" >> "$GITHUB_OUTPUT"
          echo "broken=$brk" >> "$GITHUB_OUTPUT"

      - name: Upload flow console
        if: always() && steps.console.outputs.endpoints != '0'
        uses: actions/upload-artifact@v4
        with:
          name: flow-console
          path: flow-console.html
          if-no-files-found: ignore

      - name: Post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Find a previous dxkit-guardrails comment by marker so we
          # update in place rather than appending a new one per push.
          MARKER='<!-- dxkit-guardrails -->'
          # The report exists only if ./dxkit-guardrails.sh actually ran its
          # checks. When an earlier step fails (dependency install, toolchain
          # setup, a missing script), this step still runs
          # under `if: always()`, and a bare `cat` would turn that into a
          # `No such file` error that buries the real cause several steps up. A gate
          # that could not run says so, and names where to look.
          #
          # The install step records how its dependency-install chain ended,
          # classified by dxkit's own install classifier (the same tolerance
          # classes the remediate lane and the correctness floor read). A
          # lockfile that does not record the manifest is the CHANGE's finding,
          # not an infrastructure failure: `install comment` renders it as a
          # BLOCK with the floor's own remedy; any other install failure keeps
          # the "did not run" form, naming the commands that ran and their last
          # lines. dxkit may not be in node_modules after a failed install, so
          # the CLI is resolved from the tree, then PATH (the install step
          # installs it globally as its last resort). No record (nothing could
          # classify, or a failure outside the install) keeps the generic text.
          if [ ! -f guardrail-report.md ]; then
            if [ -x ./node_modules/.bin/vyuh-dxkit ]; then DXKIT=./node_modules/.bin/vyuh-dxkit; elif command -v vyuh-dxkit >/dev/null 2>&1; then DXKIT=vyuh-dxkit; else DXKIT=""; fi
            if [ -n "$DXKIT" ] && "$DXKIT" install comment > install-comment.md 2> install-annotation.txt; then
              {
                printf '%s\n' "$MARKER"
                cat install-comment.md
              } > comment.md
              # The one-line `::error::` annotation the renderer wrote to stderr.
              cat install-annotation.txt
            else
              {
                printf '%s\n' "$MARKER"
                printf '### dxkit guardrails: did not run\n\n'
                printf 'A step before the guardrail failed, so this PR was **not** gated.\n'
                printf 'This is not a finding in your change.\n\n'
                printf 'See the failing step in this job log.\n'
              } > comment.md
              echo "::error::dxkit guardrail did not run: an earlier step failed, so this PR was NOT gated. See the failing step in this job."
            fi
          else
            {
              printf '%s\n' "$MARKER"
              cat guardrail-report.md
            } > comment.md
          fi
          # Link the flow console artifact + a short reviewer checklist when this
          # PR touched an integration. Both self-skip on a PR with no UI→API
          # surface, so a non-integration change adds nothing.
          if [ "${{ steps.console.outputs.endpoints }}" != "0" ] && [ -f flow-console.html ]; then
            printf '\n\n---\n📊 **[Interactive flow console](%s)** — download from this run'"'"'s **Artifacts** to exercise the %s integration(s) this PR touches (UI→API map + request runner; your auth stays in the browser).\n' \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "${{ steps.console.outputs.endpoints }}" >> comment.md
            {
              printf '\n**Reviewer checklist — %s integration(s) touched**\n' "${{ steps.console.outputs.endpoints }}"
              printf -- '- [ ] Opened the flow console and exercised the touched endpoint(s) against a dev/staging Base URL\n'
              if [ "${{ steps.console.outputs.broken }}" != "0" ]; then
                printf -- '- [ ] The %s net-new integration break(s) flagged above are intentional or fixed\n' "${{ steps.console.outputs.broken }}"
              fi
              printf -- '- [ ] New/changed endpoints: auth + required params behave as expected\n'
              printf -- '- [ ] Consuming UI handles error + empty responses, not just the happy path\n'
            } >> comment.md
          fi
          # GitHub caps issue comments at 65,536 characters, and an oversized
          # body fails this WHOLE job even after a PASSED gate (seen live on a
          # repo with a 23k-finding baseline). Keep the top of the report — the
          # verdict and summary lead it — cut at a line boundary, and point at
          # the job log for the rest. Bytes ≥ characters, so a byte cap is
          # safely conservative.
          MAX_BYTES=60000
          if [ "$(wc -c < comment.md)" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" comment.md | sed '$d' > comment.trunc
            {
              printf '\n\n---\n'
              printf '⚠️ **Report truncated** to fit GitHub'"'"'s comment size limit — the full report is in this run'"'"'s job log: %s/%s/actions/runs/%s\n' \
                "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}"
            } >> comment.trunc
            mv comment.trunc comment.md
          fi
          existing=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" \
            | head -n1)
          if [ -n "${existing}" ]; then
            gh api -X PATCH \
              "repos/${{ github.repository }}/issues/comments/${existing}" \
              -F body=@comment.md
          else
            gh pr comment "${PR_NUMBER}" --body-file comment.md
          fi
