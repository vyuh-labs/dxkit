name: dxkit baseline refresh

# Anchor transport: CACHE. After a merge to the default branch (or weekly / on
# demand), recompute the committed baseline anchor and store it in the GitHub
# Actions cache keyed by the merged commit SHA — NO git write at all.
#
# Why: branch protection covers branches, not the Actions cache, so this never
# needs to push anywhere — it sidesteps the push-to-protected-main deadlock
# without an extra branch. The guardrail check restores the anchor for the PR's
# base SHA; a cold cache (eviction / first run) falls back to a live re-gather
# for that one check.
#
# Trade-offs vs the 'branch' transport: caches evict after 7 idle days, are
# scoped (a cache written on the default branch is readable by PRs into it), and
# are not available to fork PRs or to a local `guardrail check`. Prefer 'branch'
# unless a rule protects every branch.

on:
  push:
    branches: [__DXKIT_DEFAULT_BRANCH__]
  schedule:
    - cron: '__DXKIT_REFRESH_CRON__'
  workflow_dispatch: {}

permissions:
__DXKIT_REFRESH_PERMISSIONS__

jobs:
__DXKIT_FRAGMENT_CAPTURE_JOBS__
  refresh:
    runs-on: ubuntu-latest
__DXKIT_REFRESH_NEEDS__
    steps:
__DXKIT_LANE_TOKEN_STEPS__

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Branch pushes reuse this persisted credential; a default-token
          # push never triggers workflow runs (a PR it opens shows no
          # checks). ONE tier chain: src/lanes/lane-token.ts.
          token: __DXKIT_LANE_TOKEN__

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Language runtime(s) for the detected stack, so the baseline is captured
      # with the SAME native scanner + toolchain the gate uses. Empty on Node-only.
__DXKIT_CI_RUNTIME_SETUP__
      - name: Install dependencies + dxkit
        run: |
          # A repo whose tree only resolves under --legacy-peer-deps (a peer
          # conflict its own install already tolerates) must not fail the gate.
          # `npm ci` installs the LOCKFILE's tree either way — the flag only
          # skips the peer check that rejects it — so the audited tree is still
          # the tree the repo ships. Re-resolving (`npm install`) is NOT a valid
          # fallback here: it would fabricate a different tree.
          __DXKIT_INSTALL_DEPS__

      - name: Install scanner tools
        run: |
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then
            ./node_modules/.bin/vyuh-dxkit tools install --yes
          else
            vyuh-dxkit tools install --yes
          fi
          # Put every ecosystem's tool-bin dir on PATH so the correct native dep
          # scanner is found (osv-scanner/pip-audit → ~/.local/bin, govulncheck →
          # ~/go/bin, cargo-audit → ~/.cargo/bin); else the audit falls back to a
          # wrong-artifact scanner and the baseline drifts from the gate.
          for d in "$HOME/.local/bin" "$HOME/go/bin" "$HOME/.cargo/bin"; do
            echo "$d" >> "$GITHUB_PATH"
          done

      - name: Recompute baseline
        # The refresh's own `gh` calls need auth: the advisory decision PR and
        # the allowlist-expiry notice issue. Without GH_TOKEN here they run
        # unauthenticated and fail silently (the per-template-drift class the
        # lane-token parity test pins).
        env:
          GH_TOKEN: __DXKIT_LANE_TOKEN__
        run: |
          if [ -x ./node_modules/.bin/vyuh-dxkit ]; then
            DXKIT=./node_modules/.bin/vyuh-dxkit
          else
            DXKIT=vyuh-dxkit
          fi
          # `baseline refresh` = capture + the D4 advisory decision lane: newly
          # published dep-vuln advisories (feed moved, no manifest change) are
          # HELD OUT of the baseline — never silently absorbed — and raised as
          # the standing two-lane decision PR (merge = defer time-boxed; fix =
          # upgrade the dependency instead).
          "${DXKIT}" baseline refresh
__DXKIT_FRAGMENT_MERGE_STEPS__

      - name: Store anchor in the Actions cache
        uses: actions/cache/save@v4
        with:
          path: .dxkit/baselines
          # Keyed by the merged commit SHA so a PR whose base is this commit
          # restores exactly this anchor. The guardrail check restores by
          # base SHA with the `dxkit-baseline-` prefix as the fallback.
          key: dxkit-baseline-${{ github.sha }}
